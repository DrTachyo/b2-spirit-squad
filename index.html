function burst(px,py,n,sp,k,m,r){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*sp;pt({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.15,k,m:m*(.5+Math.random()),r:r*(.5+Math.random()),a:Math.random()*6,w:(Math.random()-.5)*8})}}
function parts(dt){x.save();for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l+=dt;if(p.l>=p.m){PT.splice(i,1);continue}const u=p.l/p.m;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.w*dt;
 if(p.k==1){p.vy-=20*dt;p.vx*=.99}if(p.k==2)p.vy+=380*dt;
 if(p.k==0){x.globalCompositeOperation='lighter';const r=p.r*(1+u*1.2),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,'rgba(255,240,190,'+(1-u)+')');g.addColorStop(.4,'rgba(255,130,30,'+(.8*(1-u))+')');g.addColorStop(1,'rgba(120,20,0,0)');x.fillStyle=g;x.fillRect(p.x-r,p.y-r,2*r,2*r)}
 else if(p.k==1){x.globalCompositeOperation='source-over';const r=p.r*(1+u*2.2);x.fillStyle='rgba(40,40,42,'+(.5*(1-u))+')';x.beginPath();x.arc(p.x,p.y,r,0,7);x.fill()}
 else if(p.k==2){x.globalCompositeOperation='source-over';x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle='#2b2e28';x.fillRect(-p.r,-p.r*.4,p.r*2,p.r*.8);x.restore();if(Math.random()<.6)pt({x:p.x,y:p.y,k:0,m:.5,r:6});if(Math.random()<.5)pt({x:p.x,y:p.y,k:1,m:1.2,r:7})}
 else if(p.k==3){x.globalCompositeOperation='lighter';x.fillStyle='rgba(255,200,120,'+(1-u)+')';x.fillRect(p.x,p.y,2,2)}
 else if(p.k==4){x.globalCompositeOperation='lighter';x.fillStyle='rgba(255,'+(200-u*100|0)+',120,'+(1-u)+')';x.beginPath();x.arc(p.x,p.y,p.r*(1-u*.5),0,7);x.fill()}}x.restore()}
function ret(){x.save();x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=1.5;x.beginPath();x.arc(mx,my,14,0,7);x.moveTo(mx-24,my);x.lineTo(mx-8,my);x.moveTo(mx+8,my);x.lineTo(mx+24,my);x.moveTo(mx,my-24);x.lineTo(mx,my-8);x.moveTo(mx,my+8);x.lineTo(mx,my+24);x.stroke();x.restore()}
function txt(s,px,py,col,sz,al){x.font='700 '+(sz||14)+'px "Chakra Petch",monospace';x.fillStyle=col||'#e9eef5';x.textAlign=al||'left';x.fillText(s,px,py)}
function go(n){ph=n;t=0;PT=[]}
function radar(dt){const cx=W/2,cy=Hh/2+10,R=Math.min(W,Hh)*.42;x.fillStyle='#02100a';x.fillRect(0,0,W,Hh);x.strokeStyle='rgba(60,255,150,.22)';x.lineWidth=1;for(let i=1;i<=4;i++){x.beginPath();x.arc(cx,cy,R*i/4,0,7);x.stroke()}
 for(let i=0;i<12;i++){x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(i*.5236)*R,cy+Math.sin(i*.5236)*R);x.stroke()}
 const sw=t*1.7%6.283;for(let i=0;i<40;i++){x.strokeStyle='rgba(60,255,150,'+(.5*(1-i/40))+')';x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(sw-i*.012)*R,cy+Math.sin(sw-i*.012)*R);x.stroke()}
 let tgtp=null,hov=null;for(const k of CO){k.a+=k.w*dt;k.px=cx+Math.cos(k.a)*k.r*R;k.py=cy+Math.sin(k.a)*k.r*R;let d=((sw-k.a)%6.283+6.283)%6.283,br=Math.max(.25,1-d/3.2);const col=lk&&k.k=='h'?'255,80,60':'60,255,150';x.fillStyle='rgba('+col+','+br+')';x.beginPath();x.arc(k.px,k.py,5,0,7);x.fill();x.strokeStyle='rgba('+col+','+br*.6+')';x.strokeRect(k.px-9,k.py-9,18,18);if(k.k=='h')tgtp=k;if(Math.hypot(mx-k.px,my-k.py)<34&&t>2)hov=k}
 if(t<2){const j=(2-t)*14;txt('ACQUIRING TARGET',cx,cy-R-24,'#3dffa0',16,'center');x.strokeStyle='#ffb020';x.strokeRect(tgtp.px-18+Math.sin(t*30)*j,tgtp.py-18+Math.cos(t*27)*j,36,36)}
 else if(!lk){txt('HOVER A CONTACT TO IDENTIFY. CLICK THE HOSTILE GUNSHIP TO LOCK.',cx,cy-R-24,'#3dffa0',15,'center')}
 if(hov){const L={h:'AC-130  HOSTILE',f:'FRIENDLY  HOLD FIRE',u:'UNKNOWN  TRACKING'}[hov.k];txt(L,hov.px+16,hov.py-12,hov.k=='h'?'#ff6a55':hov.k=='f'?'#3dffa0':'#ffd040',13)}
 if(lk){lk+=dt;const p=Math.min(1,lk/1.1);x.strokeStyle='#ff5a40';x.lineWidth=3;x.beginPath();x.arc(tgtp.px,tgtp.py,24,-1.57,-1.57+p*6.283);x.stroke();x.lineWidth=1;txt(p<1?'LOCKING...':'TARGET LOCKED',tgtp.px+30,tgtp.py+4,'#ff5a40',15);if(lk>1.6){go(2);keep=0;mis=null;fl=[];wd=0;lt0=0}}
 txt('MISSES '+miss,24,Hh-24,'#3dffa0',13)}
function sk2(dt){sky();const sl=t<.4?1:1;gx=W*.62+Math.sin(t*.4)*W*.05;gy=Hh*.3+Math.sin(t*.9)*6;const sc=W/1000*1.3;
 if(ph==2){ac(gx,gy,sc,-.02+Math.sin(t*.5)*.015);if(Math.random()<.5)for(const px of[-58,-24,22,56])pt({x:gx+px*sc,y:gy-30*sc,k:1,m:.7,r:3,vx:-40});b2(W*.2,Hh*.8,W*.0021,-.4+Math.sin(t)*.05);
  if(!mis&&t>1.4){mis={x:W*.2+10,y:Hh*.78,a:-.9,v:140,d0:0,tg:'g'};fl=[];wd=0;keep=att>=2?1:0;shot=1;burst(mis.x,mis.y,10,80,1,1,8)}
  if(mis){const m=mis,T=m.tg=='g'?{x:gx,y:gy}:fl[0]||{x:gx,y:gy};const d=Math.hypot(T.x-m.x,T.y-m.y);if(!m.d0)m.d0=d;const want=Math.atan2(T.y-m.y,T.x-m.x);let da=((want-m.a+9.42)%6.283)-3.14;m.a+=Math.max(-3*dt,Math.min(3*dt,da));m.v=Math.min(820,m.v+520*dt);m.x+=Math.cos(m.a)*m.v*dt;m.y+=Math.sin(m.a)*m.v*dt;
   pt({x:m.x-Math.cos(m.a)*14,y:m.y-Math.sin(m.a)*14,k:1,m:1.6,r:4});pt({x:m.x-Math.cos(m.a)*10,y:m.y-Math.sin(m.a)*10,k:4,m:.18,r:7});
   if(!wd&&!keep&&d<m.d0*.5){wd=1.0;for(let i=0;i<5;i++)fl.push({x:gx-80*sc,y:gy+8*sc,vx:-30-i*14,vy:60+i*18})}
   if(wd>0){wd+=dt;for(const f of fl){f.x+=f.vx*dt;f.y+=f.vy*dt;pt({x:f.x,y:f.y,k:4,m:.35,r:9});pt({x:f.x,y:f.y,k:1,m:1,r:4})}
    if(!keep&&wd>3.4){m.tg='f'}
    txt('FLARES! CLICK THE GUNSHIP TO KEEP LOCK',W/2,60,'#ffd040',18,'center');if(keep)wd=-1}
   if(m.tg=='g'&&d<26*sc+12){hit()}else if(m.tg=='f'&&(m.x<-50||m.y>Hh+50||m.x>W+50||Math.hypot(fl[0].x-m.x,fl[0].y-m.y)<12)){att++;miss++;mis=null;t=.6;fl=[];keep=0;txt('MISSED',W/2,Hh/2,'#ff5a40',30,'center')}
   x.save();x.translate(m.x,m.y);x.rotate(m.a);x.fillStyle='#d9dde2';x.fillRect(-12,-2,24,4);x.fillStyle='#8a929c';x.fillRect(-12,-5,4,10);x.fillStyle='#c33';x.fillRect(8,-2,4,4);x.restore()}
  x.strokeStyle=keep||!wd?'#ff5a40':'#ffd040';x.strokeRect(gx-110*sc,gy-60*sc,220*sc,100*sc);txt(keep||!wd?'LOCKED  AC-130':'LOCK LOST',gx-110*sc,gy-66*sc,'#ff5a40',13)}
 else{const u=t<2.2?.3:1,d2=dt*u;sh=Math.max(0,sh-dt*3);if(half){for(const h of half){h.x+=h.vx*d2;h.y+=h.vy*d2;h.vy+=240*d2;h.a+=h.w*d2;ac(h.x,h.y,sc,h.a,h.c);if(Math.random()<.9)pt({x:h.x,y:h.y,k:Math.random()<.5?0:1,m:1.4,r:12,vx:-30})}}
  if(t>.8&&!fi){fi=1;burst(gx+20*sc,gy,60,260,0,1.1,34);burst(gx+20*sc,gy,30,200,1,3,28);sh=1;for(let i=0;i<10;i++)pt({x:gx,y:gy,vx:(Math.random()-.5)*300,vy:-Math.random()*200,k:2,m:3,r:5,a:Math.random()*6,w:6})}
  if(t>4.8){fin()}}
 if(sh>0){x.save();x.translate((Math.random()-.5)*20*sh,(Math.random()-.5)*20*sh)}parts(ph==3?dt*(t<2.2?.35:1):dt);if(sh>0)x.restore();
 if(ph==3&&t<.5){x.fillStyle='rgba(255,255,255,'+(.9*(1-t/.5))+')';x.fillRect(0,0,W,Hh)}}
function hit(){go(3);half=[{x:gx,y:gy,vx:-60,vy:-30,a:-.02,w:-.5,c:1},{x:gx,y:gy,vx:90,vy:-10,a:-.02,w:.9,c:-1}];burst(gx,gy,50,300,0,1,40);sh=1;fi=0;mis=null}
function fin(){ph=4;const a=Math.round(100*2/(2+miss+att));H.innerHTML='<div class="gr"><h2>TARGET DESTROYED</h2><p>Monthly goal complete. +30 points.</p><p>Lock accuracy: '+a+'%</p><button class="b" onclick="gEnd()">Continue</button></div><button class="b g gskip" onclick="gEnd()" style="display:none">Skip</button>'}
function tr(dt){sky();for(const k of CL)k.x=k.x;const cx=W/2+Math.sin(t*.5)*W*.03,cy=Hh*.45+Math.sin(t*.8)*Hh*.02,rl=Math.sin(t*.45)*.35,s=W*(.0035+Math.min(t,6)*.00012);b2(cx,cy,s,rl);
 txt('B-2 SPIRIT  |  ON STATION',24,Hh-24,'#ffffffcc',14);if(t>4.2)txt('CONTACT DETECTED. SWITCHING TO RADAR',W/2,70,'#ffd040',18,'center');if(t>5.2)go(1)}
function frame(ts){const dt=Math.min(.05,(ts-(frame.l||ts))/1000);frame.l=ts;t+=dt;x.clearRect(0,0,W,Hh);if(ph==0)tr(dt);else if(ph==1)radar(dt);else sk2(dt);if(ph<4){ret();raf=requestAnimationFrame(frame)}}
window.gPlay=()=>{rs();CL=[...Array(30)].map(()=>({x:Math.random()*1.4,y:.45+Math.random()*.55,s:.5+Math.random()*1.3,v:.012+Math.random()*.03}));CO=[{a:.8,r:.55,w:.05,k:'h'},{a:2.3,r:.7,w:-.04,k:'f'},{a:4.1,r:.45,w:.035,k:'f'},{a:5.3,r:.78,w:-.03,k:'u'}];miss=att=0;lk=0;sh=0;fi=0;half=null;mis=null;H.innerHTML='<button class="b g gskip" onclick="gEnd()">Skip</button>';o.hidden=false;go(0);frame.l=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)};
window.gEnd=()=>{cancelAnimationFrame(raf);raf=0;o.hidden=true;H.innerHTML=''};
c.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
c.addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY;if(ph==1&&t>2&&!lk){const k=CO.find(k=>Math.hypot(mx-k.px,my-k.py)<30);if(k&&k.k=='h')lk=.001;else{miss++;if(k)toast(k.k=='f'?'Friendly aircraft. Hold fire.':'Not hostile.')}}
 else if(ph==2&&wd>0&&!keep){if(Math.hypot(mx-gx,my-gy)<W*.13)keep=1;else{miss++}}});
addEventListener('resize',()=>{if(!o.hidden)rs()});addEventListener('keydown',e=>{if(e.key=='Escape'&&!o.hidden)gEnd()});
})();
