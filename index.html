function hbars(items){if(!items.length)return '<div class="mu sm">Nothing to show yet.</div>';return `<div class="hb">${items.map(i=>`<div class="hbr"><span class="hbl">${E(i.l)}</span><div class="hbt"><i style="width:${i.v}%;background:${colP(i.v)}"></i></div><b class="hbv">${i.v}%</b></div>`).join('')}</div>`}
function vbars(items){if(!items.length)return '<div class="mu sm">Nothing to show yet.</div>';const W=Math.max(340,items.length*70),H=220,pad=30,slot=(W-pad*2)/items.length,bw=Math.min(44,slot*.6);
 const bars=items.map((i,k)=>{const x=pad+k*slot+(slot-bw)/2,h=(H-pad*2)*i.v/100,y=H-pad-h;return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${colP(i.v)}" rx="2"><title>${E(i.l)}: ${i.v}%</title></rect><text x="${x+bw/2}" y="${y-6}" text-anchor="middle" class="svgv">${i.v}%</text><text x="${x+bw/2}" y="${H-pad+16}" text-anchor="middle" class="svgl">${E(i.l)}</text>`}).join('');
 return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Bar chart">${[0,50,100].map(g=>{const y=H-pad-(H-pad*2)*g/100;return `<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" class="grid"/><text x="2" y="${y+4}" class="svgl">${g}</text>`}).join('')}${bars}</svg></div>`}

<script>
// Monthly completion sequence: Olympus_1 > IFF > Olympus_2 > Radar > Olympus_3 > Fast radar > Olympus_4
const MONTHLY=[['v','videos/Olympus_1.mp4'],['f','pl-iff'],['v','videos/Olympus_2.mp4'],['f','pl-radar'],['v','videos/Olympus_3.mp4'],['f','pl-radar-fast'],['v','videos/Olympus_4.mp4']];
let SEQ=MONTHLY;
function plHTML(id){const b=document.getElementById(id).textContent.trim();const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
let seqI=0, TOK=0, FNEXT=null;
function runMonthly(){ if(RM) return; SEQ=MONTHLY; seqI=0; $('#seq').hidden=false; seqStep(); }
// Daily: Locking, then the daily video that matches the task's place in today's list (1-5, then repeats).
function runDaily(n){ if(RM||!$('#seq').hidden) return; SEQ=[['v','videos/Locking.mp4'],['v','videos/Daily_'+n+'.mp4']]; seqI=0; $('#seq').hidden=false; seqStep(); }
function seqStep(){
  const s=SEQ[seqI], v=$('#sv'), f=$('#sf'), tok=++TOK;
  const go=()=>{ if(tok!==TOK) return; seqI++; seqStep(); };
  FNEXT=null;
  v.onended=null; v.onerror=null; v.pause(); v.hidden=true;
  f.hidden=true; f.srcdoc='';
  if(!s){ endMonthly(); return; }
  if(s[0]==='v'){
    v.hidden=false; v.onended=go; v.onerror=()=>setTimeout(go,300);
    loadVid(s[1]).then(u=>{ if(tok!==TOK) return; v.src=u; v.play().catch(()=>setTimeout(go,300)); });
  } else {
    f.hidden=false; FNEXT=go; f.srcdoc=plHTML(s[1]);
  }
}
function endMonthly(){ TOK++; const v=$('#sv'); v.removeAttribute('src'); v.load(); $('#sf').srcdoc=''; $('#seq').hidden=true; if(VQ.length) setTimeout(()=>runVideo(VQ.shift()),50); }
addEventListener('message',e=>{
  if(FNEXT && e.source===$('#sf').contentWindow && e.data && e.data.type==='playable-ended'){ const g=FNEXT; FNEXT=null; g(); }
});
</script>
